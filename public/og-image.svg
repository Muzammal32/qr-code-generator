  </g>
  <text x="440" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="700" fill="#111827">QR Code Generator</text>
  <text x="440" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" fill="#374151">Create, customize, and scan QR codes instantly.</text>
  <text x="440" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" fill="#374151">URL, WiFi, vCard, batch CSV, PNG/SVG export.</text>
